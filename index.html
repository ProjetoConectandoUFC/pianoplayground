<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piano Interativo: Genius, Tipográfico e Gelatina</title>

    <!-- As fontes do Google (Tipográfico e Gelatina) agora vêm embutidas pelo
         src/fonts.ts (pacotes @fontsource), e o app funciona sem internet. -->

    <!-- Fontes do projeto Gelatina fora do Google Fonts (Khurasan, livres para uso pessoal e
         comercial). Os arquivos .woff2 ficam em public/fontes; o caminho é relativo para
         funcionar também no Electron empacotado e na janela de projeção. -->
    <style>
      @font-face{font-family:"Matcha Cih";src:local("Matcha Cih"),local("MatchaCih"),
        url("fontes/MatchaCih.woff2") format("woff2");font-display:swap;}
      @font-face{font-family:"Blue Winter";src:local("Blue Winter"),local("BlueWinter"),
        url("fontes/BlueWinter.woff2") format("woff2");font-display:swap;}
      /* Howdybun e Anak Gedong saíram do menu em 09/11/2026 (sem acentos; o acento
         composto ficava artificial). Os arquivos seguem em public/fontes. */

      /* Fontes variáveis com efeito próprio ("Fontes mutáveis" na lista do Gelatina).
         Os eixos são animados pelo motor da gelatina: MORF na Kablammo; BNCE, INFM e
         peso na Shantell Sans; XROT e YROT na Tilt Warp (todas
         SIL OFL 1.1). A Graduate usa o efeito automático: os eixos são lidos do arquivo no
         build e ela só aparece no painel se o arquivo estiver em public/fontes. */
      @font-face{font-family:"Tilt Warp";src:url("fontes/TiltWarp.woff2") format("woff2");font-display:swap;}
      /* Fontes pixel (teste), SIL OFL 1.1: recebem a suavização (anti-aliasing) no Gelatina */
      @font-face{font-family:"Doto";src:url("fontes/Doto.woff2") format("woff2");font-weight:100 900;font-display:swap;}
      @font-face{font-family:"Pixelify Sans";src:url("fontes/PixelifySans.woff2") format("woff2");font-weight:400 700;font-display:swap;}
      /* Hela (Renegade, trial): fonte estática, um estilo por família. O motor da gelatina
         troca de estilo ao tocar (efeito 'estilos'). Os arquivos ficam na pasta de teste que
         veio do autor, dentro de public/fontes. Cheee e Camelion (OH no Type, demo) saíram
         do menu em 09/11/2026; as pastas delas continuam lá, sem uso. */
      @font-face{font-family:"Hela 300";src:url("fontes/renegade_all_trials/RF_Hela TRIAL/RFHelaTRIAL-300.otf") format("opentype");font-display:block;}
      @font-face{font-family:"Hela 350";src:url("fontes/renegade_all_trials/RF_Hela TRIAL/RFHelaTRIAL-350.otf") format("opentype");font-display:block;}
      @font-face{font-family:"Hela 400";src:url("fontes/renegade_all_trials/RF_Hela TRIAL/RFHelaTRIAL-400.otf") format("opentype");font-display:block;}
      @font-face{font-family:"Hela 500";src:url("fontes/renegade_all_trials/RF_Hela TRIAL/RFHelaTRIAL-500.otf") format("opentype");font-display:block;}
      @font-face{font-family:"Hela 600";src:url("fontes/renegade_all_trials/RF_Hela TRIAL/RFHelaTRIAL-600.otf") format("opentype");font-display:block;}
      @font-face{font-family:"Hela 700";src:url("fontes/renegade_all_trials/RF_Hela TRIAL/RFHelaTRIAL-700.otf") format("opentype");font-display:block;}
      @font-face{font-family:"Graduate";src:url("fontes/GraduateGX.woff2") format("woff2");font-display:swap;}
      @font-face{font-family:"Kablammo";src:url("fontes/Kablammo.woff2") format("woff2");font-display:swap;}
      @font-face{font-family:"Shantell Sans";src:url("fontes/ShantellSans.woff2") format("woff2");
        font-weight:300 800;font-display:swap;}

      /* Comic Sans, Papyrus e Helvetica são fontes comerciais e não podem ir junto com o
         projeto: o app usa a versão instalada no computador (local) e, se ela não existir,
         uma fonte livre parecida que fica em public/fontes: Comic Neue (OFL), Macondo (OFL)
         e TeX Gyre Heros (GUST Font License). */
      @font-face{font-family:"PI Comic Sans";src:local("Comic Sans MS Bold"),local("ComicSansMS-Bold"),
        url("fontes/ComicNeue-Bold.woff2") format("woff2");font-display:swap;}
      @font-face{font-family:"PI Papyrus";src:local("Papyrus"),local("Papyrus-Regular"),
        url("fontes/Macondo.woff2") format("woff2");font-display:swap;}
      @font-face{font-family:"PI Helvetica";src:local("Helvetica Bold"),local("Helvetica-Bold"),local("Helvetica Neue Bold"),local("HelveticaNeue-Bold"),
        url("fontes/TeXGyreHeros-Bold.woff2") format("woff2");font-display:swap;}

      /* Fontes do Google Fonts embutidas como arquivo (SIL OFL 1.1, subconjunto latino). */
      @font-face{font-family:"Isometra";src:local("Isometra"),local("Isometra-Regular"),
        url("fontes/Isometra.woff2") format("woff2");font-display:swap;}
      @font-face{font-family:"Righteous";src:local("Righteous"),local("Righteous-Regular"),
        url("fontes/Righteous.woff2") format("woff2");font-display:swap;}
      @font-face{font-family:"Caprasimo";src:local("Caprasimo"),local("Caprasimo-Regular"),
        url("fontes/Caprasimo.woff2") format("woff2");font-display:swap;}
      @font-face{font-family:"Berkshire Swash";src:local("Berkshire Swash"),local("BerkshireSwash-Regular"),
        url("fontes/BerkshireSwash.woff2") format("woff2");font-display:swap;}
      @font-face{font-family:"Oi";src:local("Oi"),local("Oi-Regular"),
        url("fontes/Oi.woff2") format("woff2");font-display:swap;}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
